[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Grounded business knowledge assistant reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "numpy>=1.26",
    "openai>=1.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
